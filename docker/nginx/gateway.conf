# Upstream PHP-FPM Workers (K8s Service)
resolver 127.0.0.11 valid=10s;

set $backend suitecrm_worker:9000;

# Main Server (API Gateway Only)
server {
    listen 80;
    server_name _;

    root /var/www/html/SuiteCRM/public;

    # ==============================
    # Global Performance Tuning
    # ==============================
    
    client_max_body_size 10M;

    # Optimize TCP
    tcp_nopush on;
    tcp_nodelay on;

    # Disable unnecessary logs for performance
    # access_log off;

    # API ROUTING (ONLY /Api/)
    location ~ ^/Api/ {

        include fastcgi_params;
        fastcgi_pass $backend;

        # Reuse connection to upstream (important for high RPS)
        fastcgi_keep_conn on;

        # Force all requests to go through front controller
        fastcgi_param SCRIPT_FILENAME /var/www/html/SuiteCRM/public/index.php;

        # Preserve original request URI (important for Symfony routing)
        fastcgi_param REQUEST_URI $request_uri;

        # Buffer tuning (for JSON APIs)
        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 256k;
        fastcgi_busy_buffers_size 256k;

        # Timeouts (tuned for high load)
        fastcgi_connect_timeout 5s;   # connect to PHP
        fastcgi_send_timeout 30s;     # send request
        fastcgi_read_timeout 60s;     # wait response

        # Security headers (basic hardening)
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Optional: CORS
        # add_header Access-Control-Allow-Origin *;
    }

    # BLOCK ALL OTHER ROUTES
    location / {
        return 403 "Forbidden: API gateway only.";
    }

    # BLOCK HIDDEN FILES (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}