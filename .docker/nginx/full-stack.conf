server {
    listen 80;
    server_name localhost;

    root /var/www/html/SuiteCRM/public;
    index index.php;

    # ==============================
    # 1. Friendly URLs (Symfony/SuiteCRM)
    # ==============================
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ==============================
    # 2. PHP-FPM handling
    # ==============================
    location ~ \.php$ {
        # ❗ SECURITY: Do not allow to execute file not existing (prevents path traversal)
        try_files $uri =404;

        include fastcgi_params;

        # Run on the same container
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        # ❗ CRITICAL: fix path traversal vulnerability
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # Fix PATH_INFO (Symfony needs this for routing)
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # ==============================
        # Performance tuning
        # ==============================
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Timeouts (tuned for high load, adjust as needed)
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 60s;

        # Reuse connection to upstream (important for high RPS)
        fastcgi_keep_conn on;
    }

    # ==============================
    # 3. Static files
    # ==============================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # ==============================
    # 4. Security: block sensitive files
    # ==============================
    
    # Block .htaccess, .env, .git...
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block composer / config / yaml / twig
    location ~* \.(env|ini|log|conf|yaml|yml|twig|sql)$ {
        deny all;
    }

    # ==============================
    # 5. Limit request size
    # ==============================
    client_max_body_size 10M;

    # ==============================
    # 6. Basic security headers
    # ==============================
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # ==============================
    # 7. Optional: health check
    # ==============================
    location = /healthz {
        return 200 "OK";
        access_log off;
    }
}