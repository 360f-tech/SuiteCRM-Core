upstream api_gateway {
    server suitecrm_gateway:80; 
}

upstream web_app {
    server suitecrm_web:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev-epos-crm.360f.com;
    return 301 https://$host$request_uri;
}

server {	
	listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev-epos-crm.360f.com;

    ssl_certificate /etc/nginx/ssl/dev-epos-crm.360f.com.crt;
    ssl_certificate_key /etc/nginx/ssl/dev-epos-crm.360f.com.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Route to api_gateway
    location /Api {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    # Route to web
    location / {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}